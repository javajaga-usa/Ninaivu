# The docs site: `pip install mkdocs-material` then `mkdocs serve`.
# .github/workflows/docs.yml publishes it to GitHub Pages on every push to main.
site_name: Ninaivu
site_description: Your family's photographs, at home.
site_url: https://javajaga-usa.github.io/Ninaivu/
repo_url: https://github.com/javajaga-usa/Ninaivu
repo_name: javajaga-usa/Ninaivu
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site-build
copyright: MIT licence

theme:
  name: material
  logo: ../ninaivu/static/icons/icon-192.png
  favicon: ../ninaivu/static/icons/icon-192.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: site/index.md
  - Install: site/install.md
  - The first day: site/first-day.md
  - Family and roles: site/family-and-roles.md
  - Backup: site/backup.md
  - Remote access: site/remote-access.md
  - AI: site/ai.md
  - Troubleshooting: site/troubleshooting.md
  - The guide:
      - The family app: site/guide-family.md
      - The console: site/guide-console.md
  - More:
      - A tour of the screens: screens.md
      - The tray and HTTPS: desktop-control.md
      - Operations: operations/production.md
      - Backup and recovery (tools): backup-recovery.md
      - Encryption and the recovery file: encryption-files.md
      - Moving to another machine: moving-to-another-machine.md
      - Date access: date-access.md
      - Changelog: CHANGELOG.md
      - Roadmap: ROADMAP.md
      - Contributing: CONTRIBUTING.md
      - Security: SECURITY.md

