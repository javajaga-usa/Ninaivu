# The docs site: `pip install mkdocs-material` then `mkdocs serve`.
# .github/workflows/docs.yml publishes it to GitHub Pages on every push to main.
site_name: Ninaivu
site_description: Your family's photographs, at home.
site_url: https://javajaga-usa.github.io/Ninaivu/
repo_url: https://github.com/javajaga-usa/Ninaivu
repo_name: javajaga-usa/Ninaivu
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site-build
copyright: MIT licence

theme:
  name: material
  logo: assets/icon-192.png
  favicon: assets/icon-192.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Install: site/install.md
  - The first day: site/first-day.md
  - Family and roles: site/family-and-roles.md
  - Backup: site/backup.md
  - Remote access: site/remote-access.md
  - AI: site/ai.md
  - Troubleshooting: site/troubleshooting.md
  - The guide:
      - The family app: site/guide-family.md
      - The console: site/guide-console.md
  - தமிழ்:
      - நினைவு: site/ta/index.md
      - நிறுவுதல்: site/ta/install.md
      - முதல் நாள்: site/ta/first-day.md
      - குடும்பமும் பங்குகளும்: site/ta/family-and-roles.md
      - காப்புப்பிரதி: site/ta/backup.md
      - வெளியிலிருந்து அணுகுதல்: site/ta/remote-access.md
      - AI: site/ta/ai.md
      - சிக்கல் தீர்த்தல்: site/ta/troubleshooting.md
      - குடும்பச் செயலி: site/ta/guide-family.md
      - நிர்வாக பலகை: site/ta/guide-console.md
  - More:
      - A tour of the screens: screens.md
      - The tray and HTTPS: desktop-control.md
      - Operations: operations/production.md
      - Backup and recovery (tools): backup-recovery.md
      - Encryption and the recovery file: encryption-files.md
      - Moving to another machine: moving-to-another-machine.md
      - Date access: date-access.md
      - Changelog: CHANGELOG.md
      - Roadmap: ROADMAP.md
      - Contributing: CONTRIBUTING.md
      - Security: SECURITY.md
      - Third-party notices: THIRD_PARTY_NOTICES.md

# The developer index of docs/ is for the repository, not the site; the
# site's home is index.md.
exclude_docs: |
  README.md
