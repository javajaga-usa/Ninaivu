<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared photographs · {{ app_name }}</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e8833a'/><path d='M5 15 16 6l11 9v10a1.5 1.5 0 0 1-1.5 1.5h-19A1.5 1.5 0 0 1 5 25Z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/><path d='M12.5 26.5v-6a3.5 3.5 0 0 1 7 0v6' fill='none' stroke='white' stroke-width='2.2'/></svg>">
<style>
  :root {
    color-scheme: dark;
    --ground: #131417; --panel: #1b1e24; --ink: #e9e9ec;
    --muted: #9aa1ad; --line: #2c2f36; --accent: #e8833a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 18px 22px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  .muted { color: var(--muted); font-size: 0.88rem; }
  main { padding: 22px; max-width: 1400px; margin: 0 auto; }
  .grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  }
  .grid a { display: block; aspect-ratio: 1; background: #000; border-radius: 8px; overflow: hidden; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .single { display: grid; place-items: center; }
  .single img, .single video { max-width: 100%; max-height: 82vh; border-radius: 10px; }
  form { display: grid; gap: 12px; max-width: 320px; margin: 12vh auto 0; text-align: center; }
  input[type=password] {
    padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-size: 1rem;
  }
  button {
    padding: 10px 14px; border-radius: 8px; border: 0; cursor: pointer;
    background: var(--accent); color: #17130f; font-weight: 600; font-size: 0.95rem;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error { color: #e8756c; font-size: 0.9rem; min-height: 1.2em; }
  .empty { color: var(--muted); text-align: center; padding: 14vh 0; }
  /* Shared links carry the same quiet surfaces and rounded photo frames. */
  body { background: radial-gradient(ellipse at 100% 0, #1d2340, transparent 65%), var(--ground); }
  header { padding: 22px; background: #131417; border-bottom-color: #292e3d; }
  h1 { letter-spacing: -.025em; font-size: 1.15rem; }
  .grid { gap: 14px; }
  .grid a { border-radius: 14px; box-shadow: 0 4px 16px #00000020; }
  .grid a:focus-visible { outline: 3px solid #88bfff; outline-offset: 3px; }
  form { padding: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; width: min(360px, 100%); max-width: 360px; }
  input[type=password] { min-width: 0; width: 100%; border-radius: 12px; }
  button { border-radius: 12px; }
  @media (max-width: 480px) {
    main { padding: 16px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    header { padding: 18px 16px; }
  }
</style>
</head>
<body data-share-token="{{ token }}" data-app-name="{{ app_name }}">
<header>
  <h1 id="title" data-i18n="Shared photographs">Shared photographs</h1>
  <span class="muted" id="count"></span>
  <span class="muted" style="margin-left:auto" id="from">Shared from {{ app_name }}</span>
</header>
<main id="main"><p class="empty" data-i18n="Loading…">Loading…</p></main>

<script type="module" src="{{ asset('/static/js/share.js') }}"></script>
</body>
</html>
