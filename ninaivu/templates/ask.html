<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ app_name }}</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b7fd4'/><path d='M5 15 16 6l11 9v10a1.5 1.5 0 0 1-1.5 1.5h-19A1.5 1.5 0 0 1 5 25Z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/><path d='M12.5 26.5v-6a3.5 3.5 0 0 1 7 0v6' fill='none' stroke='white' stroke-width='2.2'/></svg>">
<style>
  /* A "who is this?" link is opened by somebody with no account, most often
     on a phone, often an elder: its own small page, like share.html, with
     the same palette and Tamil faces, large type and large targets. */
  @font-face {
    font-family: "Ninaivu Tamil";
    src: local("Tamil Sangam MN"), local("TamilSangamMN"){% if tamil_font %},
         url("/static/fonts/NotoSansTamil.ttf") format("truetype"){% endif %};
    font-weight: 100 549; font-display: swap;
    unicode-range: U+0B80-0BFF, U+200C-200D, U+25CC;
  }
  @font-face {
    font-family: "Ninaivu Tamil";
    src: local("Tamil Sangam MN Bold"), local("TamilSangamMN-Bold"){% if tamil_font %},
         url("/static/fonts/NotoSansTamil.ttf") format("truetype"){% endif %};
    font-weight: 550 900; font-display: swap;
    unicode-range: U+0B80-0BFF, U+200C-200D, U+25CC;
  }
  :root {
    color-scheme: light dark;
    --ground: #f6f7f9; --panel: #ffffff; --ink: #10151c; --muted: #5b6675;
    --line: #dfe3ea; --accent: #0b7fd4; --accent-ink: #ffffff;
    --accent-weak: rgba(11, 127, 212, .10); --danger: #d8353d;
    --shadow: 0 8px 28px rgba(16, 21, 28, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0c0f14; --panel: #161b23; --ink: #e9ecf1; --muted: #98a2b3;
      --line: #252b36; --accent: #4da3ff; --accent-ink: #06121f;
      --accent-weak: rgba(77, 163, 255, .14); --danger: #ff7b72;
      --shadow: 0 10px 34px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; color: var(--ink); background: var(--ground);
    font: 17px/1.55 "Ninaivu Tamil", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    border-bottom: 1px solid var(--line);
    /* Solid, not glass: Safari on iOS 26 blurs the top of a page whose bar is
       see-through (see .topbar in style.css). */
    background: var(--panel);
  }
  h1 { margin: 0; font-size: 1.1rem; font-weight: 650; flex: 1; min-width: 0; }
  .langs { display: flex; gap: 6px; }
  .langs button {
    min-width: 44px; min-height: 40px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font: inherit; font-size: .95rem; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 650; }
  main {
    max-width: 640px; margin: 0 auto;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom, 0px));
  }
  .lead { margin: 4px 0 18px; color: var(--muted); }
  .face {
    display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start;
    padding: 14px; margin-bottom: 14px; border-radius: 18px;
    background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .face img.crop { width: 112px; height: 112px; border-radius: 14px; object-fit: cover; background: var(--line); }
  .face .fields { display: grid; gap: 8px; min-width: 0; }
  .face .photo { grid-column: 1 / -1; }
  .face .photo img { width: 100%; border-radius: 12px; display: block; }
  label { display: grid; gap: 4px; font-size: .92rem; color: var(--muted); }
  input, textarea {
    width: 100%; min-width: 0; padding: 11px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--ground); color: var(--ink);
    font: inherit; font-size: 1rem;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  .link {
    background: none; border: 0; padding: 4px 0; color: var(--accent);
    font: inherit; font-size: .95rem; cursor: pointer; text-align: left;
  }
  .send {
    width: 100%; min-height: 52px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 650;
  }
  .send:disabled { opacity: .6; cursor: default; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .who { margin: 8px 0 14px; }
  .error { color: var(--danger); min-height: 1.2em; margin: 8px 0; }
  .empty { color: var(--muted); text-align: center; padding: 12vh 0; }
  @media (max-width: 380px) {
    .face { grid-template-columns: 1fr; }
    .face img.crop { width: 140px; height: 140px; }
  }

  /* The same finish as the family app (static/css/premium.css): a lit top
     edge and a layered lift on the card and the button, a ring on the fields.
     The header stays solid (see above). */
  :root { --hi: inset 0 1px 0 rgba(255, 255, 255, .8); --ring: 0 0 0 3.5px color-mix(in srgb, var(--accent) 22%, transparent); }
  @media (prefers-color-scheme: dark) {
    :root { --hi: inset 0 1px 0 rgba(255, 255, 255, .055); --ring: 0 0 0 3.5px color-mix(in srgb, var(--accent) 30%, transparent); }
  }
  header { box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 4%, transparent), 0 6px 18px -12px color-mix(in srgb, var(--ink) 30%, transparent); }
  .langs button { box-shadow: 0 1px 1px color-mix(in srgb, var(--ink) 5%, transparent), var(--hi); transition: border-color .15s, box-shadow .15s; }
  .langs button[aria-pressed="true"] { box-shadow: var(--ring), var(--hi); }
  .face { box-shadow: var(--shadow), var(--hi), 0 0 0 1px color-mix(in srgb, var(--ink) 5%, transparent); }
  input, textarea { box-shadow: inset 0 1px 2px color-mix(in srgb, var(--ink) 5%, transparent); transition: border-color .15s, box-shadow .15s; }
  input:focus, textarea:focus { box-shadow: var(--ring); }
  .send {
    background: linear-gradient(180deg, color-mix(in srgb, #fff 18%, transparent), transparent 55%), var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 82%, #000);
    box-shadow: 0 1px 2px color-mix(in srgb, var(--accent) 30%, transparent), 0 6px 18px -4px color-mix(in srgb, var(--accent) 60%, transparent), inset 0 1px 0 color-mix(in srgb, #fff 28%, transparent);
    text-shadow: 0 1px 0 color-mix(in srgb, #000 14%, transparent);
    transition: box-shadow .15s, transform .1s;
  }
  .send:hover:not(:disabled) { box-shadow: 0 1px 2px color-mix(in srgb, var(--accent) 30%, transparent), 0 10px 26px -6px color-mix(in srgb, var(--accent) 70%, transparent), inset 0 1px 0 color-mix(in srgb, #fff 32%, transparent); }
  .send:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible { outline: none; box-shadow: var(--ring); }
  @media (prefers-reduced-motion: reduce) { .send, .langs button, input, textarea { transition: none; } .send:active:not(:disabled) { transform: none; } }
</style>
</head>
<body data-ask-token="{{ token }}" data-app-name="{{ app_name }}">
<header>
  <h1 id="title">{{ app_name }}</h1>
  <div class="langs" id="langs"></div>
</header>
<main id="main"><p class="empty">…</p></main>

<script type="module" src="{{ asset('/static/js/ask.js') }}"></script>
</body>
</html>
