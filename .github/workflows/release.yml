name: Release installers

# On a version tag: the Windows installer (pynsist), the macOS app and disk
# image for both architectures, the Linux and Raspberry Pi installer for both
# architectures, all attached to the GitHub release, and the winget manifests
# and Homebrew cask for that version as artifacts. Every installer carries its
# own Python and every package, and ships Ninaivu as bytecode, not source.
#
# Signing is real only when the secrets exist. Without them every job still
# builds, but unsigned, and the release notes say so — a fork can test the
# whole path without a certificate. The secrets:
#
#   WINDOWS_SIGN_PFX_BASE64, WINDOWS_SIGN_PFX_PASSWORD   a code-signing certificate
#   MAC_SIGN_P12_BASE64, MAC_SIGN_P12_PASSWORD           a Developer ID Application certificate
#   MAC_SIGN_IDENTITY                                    its name, "Developer ID Application: … (TEAMID)"
#   MAC_NOTARY_APPLE_ID, MAC_NOTARY_TEAM_ID, MAC_NOTARY_PASSWORD   an app-specific password
#   WINGET_TOKEN                                         a GitHub token for the winget-pkgs fork (optional)

# A tag push is the usual way. "Run workflow" on a branch builds the same
# installers and publishes them as the release for the version in
# ninaivu/__init__.py, making that tag at the commit it ran on — for the
# times a tag cannot be pushed from where the release is being made.
#
# A pull request that changes the installers, this workflow or the guide's
# builder builds every installer too, unsigned, and stops there: the job that
# publishes runs only for a tag or "Run workflow". A broken installer build
# shows up on the pull request, not on the day of a release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "installers/**"
      - ".github/workflows/release.yml"
      - "tools/build_guide_pdf.py"
      - "requirements/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 60
    # A step's own `env` is not visible to its `if`; whether each secret is
    # there has to be known at job level, or signing is skipped every time.
    env:
      HAS_PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pynsist and NSIS
        run: |
          pip install pynsist
          choco install nsis -y --no-progress

      - name: Import the signing certificate
        if: env.HAS_PFX == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          Remove-Item $path
          "NINAIVU_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          & installers\windows\build.ps1 -Sign:([bool]$env:NINAIVU_SIGN_THUMBPRINT)

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installers/windows/build/nsis/*.exe
            installers/windows/build/winget/**

  macos:
    name: macOS app (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      HAS_P12: ${{ secrets.MAC_SIGN_P12_BASE64 != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import the signing certificate
        if: env.HAS_P12 == 'true'
        env:
          P12: ${{ secrets.MAC_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -P "$P12_PASSWORD" -A -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/sign.p12"
          # Without this, codesign stops with errSecInternalComponent.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials ninaivu --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" --keychain "$keychain"
          echo "NINAIVU_MAC_SIGN_IDENTITY=${{ secrets.MAC_SIGN_IDENTITY }}" >> "$GITHUB_ENV"
          echo "NINAIVU_NOTARY_PROFILE=ninaivu" >> "$GITHUB_ENV"
          echo "NINAIVU_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: bash installers/macos/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            installers/macos/build/*.dmg
            installers/macos/build/homebrew/ninaivu.rb

  linux:
    name: Linux and Raspberry Pi (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash installers/linux/build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: installers/linux/build/*.sh

  release:
    name: Attach to the release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    env:
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
      HAS_PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.MAC_SIGN_P12_BASE64 != '' && secrets.MAC_NOTARY_PASSWORD != '' }}
    steps:
      # The guide's pages, its builder and the changelog go out with the installers.
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: The version being released
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then version=${GITHUB_REF_NAME#v}
          else version=$(sed -nE 's/^__version__ *= *"([^"]+)".*/\1/p' src/ninaivu/__init__.py); fi
          [ -n "$version" ] || { echo "no version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "releasing $version"
      - name: One cask with both hashes
        run: |
          arm=$(sha256sum out/macos-arm64/*.dmg | cut -d' ' -f1)
          intel=$(sha256sum out/macos-x86_64/*.dmg | cut -d' ' -f1)
          sed -e "s/__SHA256_ARM64__/$arm/" -e "s/__SHA256_X86_64__/$intel/" out/macos-arm64/homebrew/ninaivu.rb > out/ninaivu.rb
          mkdir -p out/winget && cp -r out/windows/winget/* out/winget/ 2>/dev/null || true
          ls -R out
      # The guides are built here from the pages at this tag, so the PDFs that
      # go out always say what the pages say — the copies committed under
      # docs/ are for reading on GitHub and can lag a change to a page.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The guide, in English and Tamil
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-core
          fc-list | grep -qi "Noto Sans Tamil" || { echo "no Tamil font: the Tamil guide would print boxes"; exit 1; }
          pip install -q markdown playwright
          python -m playwright install --with-deps chromium
          python src/tools/build_guide_pdf.py out/Ninaivu-guide.pdf
          python src/tools/build_guide_pdf.py --lang ta out/Ninaivu-guide-ta.pdf
      - name: Checksums
        run: |
          (cd out && sha256sum windows/nsis/*.exe macos-arm64/*.dmg macos-x86_64/*.dmg linux-amd64/*.sh linux-arm64/*.sh > SHA256SUMS.txt && cat SHA256SUMS.txt)
      # The notes say what is in this release (its section of the changelog)
      # and, honestly, whether the installers are signed: an unsigned one
      # meets SmartScreen on Windows and Gatekeeper on a Mac, and the person
      # opening it should know that before they see the warning.
      - name: Release notes
        run: |
          version=$VERSION
          {
            echo "Ninaivu $version — your family's photographs, on a computer at home."
            echo
            echo "**Windows:** \`Ninaivu-$version-windows-x64.exe\`. **macOS:** the \`.dmg\` for Apple silicon (\`arm64\`) or Intel (\`x86_64\`). **Linux and Raspberry Pi:** \`Ninaivu-$version-linux-amd64.sh\` for a PC, \`Ninaivu-$version-linux-arm64.sh\` for a Raspberry Pi 4 or 5 with a 64-bit OS — run it with \`sh\`, no root needed. Or run it from source, or with Docker — see the install guide."
            echo "Every installer carries its own Python, so the computer needs none, and every package: nothing is downloaded at install time. The checksums are in \`SHA256SUMS.txt\`; \`ninaivu.rb\` is the Homebrew cask and the winget manifests are in the build artifacts, for publishing to those catalogues."
            echo
            echo "**The guide**, to read or share: \`Ninaivu-guide.pdf\` (English) and \`Ninaivu-guide-ta.pdf\` (தமிழ்)."
            echo
            if [ "$HAS_PFX" != "true" ]; then
              echo "> **The Windows installer is not signed.** SmartScreen will say *Windows protected your PC*: choose **More info → Run anyway**."
              echo
            fi
            if [ "$HAS_NOTARY" != "true" ]; then
              echo "> **The Mac app is not signed or notarised.** macOS will refuse to open it at first: open it once, then go to **System Settings → Privacy & Security** and choose **Open Anyway**."
              echo
            fi
            echo "## What is in $version"
            awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' src/docs/CHANGELOG.md
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Ninaivu v${{ env.VERSION }}
          body_path: notes.md
          files: |
            out/windows/nsis/*.exe
            out/macos-arm64/*.dmg
            out/macos-x86_64/*.dmg
            out/linux-amd64/*.sh
            out/linux-arm64/*.sh
            out/ninaivu.rb
            out/SHA256SUMS.txt
            out/Ninaivu-guide.pdf
            out/Ninaivu-guide-ta.pdf

      - name: Open the winget pull request
        if: env.HAS_WINGET_TOKEN == 'true'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          version=$VERSION
          # wingetcreate is a Windows tool; the manifests are complete, so the
          # cross-platform route is the winget-pkgs fork and a PR from it.
          echo "Manifests for $version are in out/winget; submit them to microsoft/winget-pkgs under manifests/n/Ninaivu/Ninaivu/$version/."
