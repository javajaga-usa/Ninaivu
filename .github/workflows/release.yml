name: Release installers

# On a version tag: the Windows installer (pynsist), the macOS app and disk
# image for both architectures, all three attached to the GitHub release,
# and the winget manifests and Homebrew cask for that version as artifacts.
#
# Signing is real only when the secrets exist. Without them every job still
# builds, but unsigned, and the release notes say so — a fork can test the
# whole path without a certificate. The secrets:
#
#   WINDOWS_SIGN_PFX_BASE64, WINDOWS_SIGN_PFX_PASSWORD   a code-signing certificate
#   MAC_SIGN_P12_BASE64, MAC_SIGN_P12_PASSWORD           a Developer ID Application certificate
#   MAC_SIGN_IDENTITY                                    its name, "Developer ID Application: … (TEAMID)"
#   MAC_NOTARY_APPLE_ID, MAC_NOTARY_TEAM_ID, MAC_NOTARY_PASSWORD   an app-specific password
#   WINGET_TOKEN                                         a GitHub token for the winget-pkgs fork (optional)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022
    # A step's own `env` is not visible to its `if`; whether each secret is
    # there has to be known at job level, or signing is skipped every time.
    env:
      HAS_PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pynsist and NSIS
        run: |
          pip install pynsist
          choco install nsis -y --no-progress

      - name: Import the signing certificate
        if: env.HAS_PFX == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          Remove-Item $path
          "NINAIVU_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          & installers\windows\build.ps1 -Sign:([bool]$env:NINAIVU_SIGN_THUMBPRINT)

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installers/windows/build/nsis/*.exe
            installers/windows/build/winget/**

  macos:
    name: macOS app (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      HAS_P12: ${{ secrets.MAC_SIGN_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import the signing certificate
        if: env.HAS_P12 == 'true'
        env:
          P12: ${{ secrets.MAC_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -P "$P12_PASSWORD" -A -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/sign.p12"
          # Without this, codesign stops with errSecInternalComponent.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials ninaivu --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" --keychain "$keychain"
          echo "NINAIVU_MAC_SIGN_IDENTITY=${{ secrets.MAC_SIGN_IDENTITY }}" >> "$GITHUB_ENV"
          echo "NINAIVU_NOTARY_PROFILE=ninaivu" >> "$GITHUB_ENV"
          echo "NINAIVU_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: bash installers/macos/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            installers/macos/build/*.dmg
            installers/macos/build/homebrew/ninaivu.rb

  release:
    name: Attach to the release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    env:
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: One cask with both hashes
        run: |
          arm=$(sha256sum out/macos-arm64/*.dmg | cut -d' ' -f1)
          intel=$(sha256sum out/macos-x86_64/*.dmg | cut -d' ' -f1)
          sed -e "s/__SHA256_ARM64__/$arm/" -e "s/__SHA256_X86_64__/$intel/" out/macos-arm64/homebrew/ninaivu.rb > out/ninaivu.rb
          mkdir -p out/winget && cp -r out/windows/winget/* out/winget/ 2>/dev/null || true
          ls -R out
      - name: Checksums
        run: |
          (cd out && sha256sum windows/nsis/*.exe macos-arm64/*.dmg macos-x86_64/*.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/windows/nsis/*.exe
            out/macos-arm64/*.dmg
            out/macos-x86_64/*.dmg
            out/ninaivu.rb
            out/SHA256SUMS.txt
          body: |
            Installers for this version. Windows: the `.exe` (also `winget install Ninaivu.Ninaivu` once the manifest is merged). macOS: the `.dmg` for Apple Silicon (`arm64`) or Intel (`x86_64`), or `brew install --cask ninaivu`.

            Everything runs on your own computer; nothing is downloaded at install time. The checksums are in `SHA256SUMS.txt`.

      - name: Open the winget pull request
        if: env.HAS_WINGET_TOKEN == 'true'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # wingetcreate is a Windows tool; the manifests are complete, so the
          # cross-platform route is the winget-pkgs fork and a PR from it.
          echo "Manifests for $version are in out/winget; submit them to microsoft/winget-pkgs under manifests/n/Ninaivu/Ninaivu/$version/."
