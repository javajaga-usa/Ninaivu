name: Release installers

# On a version tag: the Windows installer (pynsist) and a portable zip of it
# (Ninaivu.exe, app\ and logs\ at its top), the macOS app and disk
# image for both architectures, the Linux and Raspberry Pi installer for both
# architectures, all attached to the GitHub release, and the winget manifests
# and Homebrew cask for that version as artifacts. Every installer carries its
# own Python and every package, and ships Ninaivu as bytecode, not source.
#
# Signing is real only when the secrets exist. Without them every job still
# builds, but unsigned, and the release notes say so — a fork can test the
# whole path without a certificate. The secrets:
#
#   WINDOWS_SIGN_PFX_BASE64, WINDOWS_SIGN_PFX_PASSWORD   a code-signing certificate
#   MAC_SIGN_P12_BASE64, MAC_SIGN_P12_PASSWORD           a Developer ID Application certificate
#   MAC_SIGN_IDENTITY                                    its name, "Developer ID Application: … (TEAMID)"
#   MAC_NOTARY_APPLE_ID, MAC_NOTARY_TEAM_ID, MAC_NOTARY_PASSWORD   an app-specific password
#   WINGET_TOKEN                                         a GitHub token for the winget-pkgs fork (optional)

# A tag push is the usual way. "Run workflow" on main builds the same
# installers and publishes them as the release for the version in
# ninaivu/__init__.py, making that tag at the commit it ran on — for the
# times a tag cannot be pushed from where the release is being made.
#
# Before anything is built for a release, the first job checks that it may be
# one (v1.0.0 went out from a commit whose Windows tests had failed, and
# v1.0.1 while its tests were still running; a second "Run workflow" replaced
# the assets of a release already out):
#   - "Run workflow" only from main;
#   - a tag is v + __version__;
#   - no release of that version exists yet, and for "Run workflow" no tag;
#   - "Tests & Linting" passed on this very commit (waited for while it runs).
#
# A pull request that changes the installers, this workflow or the guide's
# builder builds every installer too, unsigned, and stops there: the job that
# publishes runs only for a tag or "Run workflow". A broken installer build
# shows up on the pull request, not on the day of a release.
#
# What each installer bundles is the set in requirements/constraints-tested.txt
# (the one tests.yml runs with), and each build lists what it took, with
# hashes, in a *-packages.txt that goes out with the release. The build tools
# are pinned in requirements/build-tools.txt.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "installers/**"
      - ".github/workflows/release.yml"
      - "tools/build_guide_pdf.py"
      - "tools/guide_pdf.css"
      - "requirements/**"
      - "pyproject.toml"
  workflow_dispatch:

# Read-only unless a job says otherwise: only the job that publishes may write.
permissions:
  contents: read

# One release at a time, and never cancelled part way: two "Run workflow"s of
# the same version (or a re-run after a failure between making the draft and
# publishing it) would otherwise both pass the gate and write their installers
# into the same draft, one run's checksums beside the other's files. A pull
# request's check builds are grouped by their own ref and do not wait for it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

jobs:
  gate:
    name: May this be released?
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
      - name: Check the version, the branch, what exists and the tests
        id: check
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api() { curl -sS -o "$RUNNER_TEMP/api.json" -w '%{http_code}' \
                    -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/$GITHUB_REPOSITORY/$1"; }
          version=$(sed -nE 's/^__version__ *= *"([^"]+)".*/\1/p' ninaivu/__init__.py)
          [ -n "$version" ] || { echo "::error::no __version__ in ninaivu/__init__.py"; exit 1; }
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::__version__ is not a release version: $version"; exit 1; }
          for pyproject in extensions/*/pyproject.toml; do
            [ -f "$pyproject" ] || continue
            grep -qE "^version = \"$version\"$" "$pyproject" || { echo "::error::$pyproject does not match the release version $version"; exit 1; }
          done
          grep -qE "^## ${version} — " docs/CHANGELOG.md || { echo "::error::docs/CHANGELOG.md does not contain a section for $version"; exit 1; }
          tag="v$version"
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$REF" = refs/heads/main ] || { echo "::error::Run workflow only from main, not $REF"; exit 1; }
            code=$(api "git/ref/tags/$tag")
            [ "$code" = 404 ] || { echo "::error::the tag $tag exists already (HTTP $code); raise __version__ for a new release"; exit 1; }
          elif [ "$REF_TYPE" = tag ]; then
            [ "$REF_NAME" = "$tag" ] || { echo "::error::the tag $REF_NAME is not v + __version__ ($tag)"; exit 1; }
            # A tag pushed on a commit that main does not have would release
            # what was never on main (its tests ran somewhere else, if at all).
            code=$(api "compare/main...$SHA")
            [ "$code" = 200 ] || { echo "::error::could not compare $SHA with main (HTTP $code)"; exit 1; }
            where=$(jq -r '.status' "$RUNNER_TEMP/api.json")
            case "$where" in identical|behind) ;; *) echo "::error::the tag $tag is on a commit that is not on main ($where)"; exit 1;; esac
          else
            echo "::error::a release is made from a tag or from Run workflow"; exit 1
          fi
          code=$(api "releases/tags/$tag")
          [ "$code" = 404 ] || { echo "::error::a release for $tag exists already (HTTP $code); its installers are not replaced"; exit 1; }

          # The tests, on this commit. Waited for while they run, up to 90 minutes.
          for attempt in $(seq 1 90); do
            code=$(api "actions/workflows/tests.yml/runs?head_sha=$SHA&per_page=100")
            [ "$code" = 200 ] || { echo "::error::could not read the test runs (HTTP $code)"; exit 1; }
            # Only runs on a push of this commit: a pull request's run tested
            # the merge of it with its base, which is a different commit.
            passed=$(jq '[.workflow_runs[] | select(.event == "push" and .status == "completed" and .conclusion == "success")] | length' "$RUNNER_TEMP/api.json")
            running=$(jq '[.workflow_runs[] | select(.event == "push" and .status != "completed")] | length' "$RUNNER_TEMP/api.json")
            if [ "$passed" -gt 0 ]; then
              echo "Tests & Linting passed on $SHA"; break
            fi
            if [ "$running" -eq 0 ]; then
              echo "::error::Tests & Linting has not passed on $SHA; push it to main (or re-run the failed jobs) and try again"
              exit 1
            fi
            echo "Tests & Linting is still running on $SHA; waiting ($attempt)"
            sleep 60
          done
          [ "$passed" -gt 0 ] || { echo "::error::Tests & Linting did not finish on $SHA in time"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"

  windows:
    name: Windows installer
    needs: gate
    runs-on: windows-2022
    timeout-minutes: 60
    # A step's own `env` is not visible to its `if`; whether each secret is
    # there has to be known at job level, or signing is skipped every time.
    env:
      HAS_PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pynsist and NSIS
        run: |
          python -m pip install -c requirements/build-tools.txt pip pynsist
          choco install nsis --version=3.10 -y --no-progress

      - name: Import the signing certificate
        if: env.HAS_PFX == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          Remove-Item $path
          "NINAIVU_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          & installers\windows\build.ps1 -Sign:([bool]$env:NINAIVU_SIGN_THUMBPRINT)

      # The portable zip is made from what the installer build just assembled
      # (its Python and its packages), in this same job: nothing is built or
      # fetched twice, and the zip holds Ninaivu.exe, app\ and logs\ and
      # nothing else at its top.
      - name: Portable zip
        shell: pwsh
        run: |
          & installers\windows\build-portable.ps1 -Sign:([bool]$env:NINAIVU_SIGN_THUMBPRINT)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            installers/windows/build/nsis/*.exe
            installers/windows/build/nsis/*-packages.txt
            installers/windows/build/portable/*.zip
            installers/windows/build/winget/**

  macos:
    name: macOS app (${{ matrix.arch }})
    needs: gate
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      HAS_P12: ${{ secrets.MAC_SIGN_P12_BASE64 != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Import the signing certificate
        if: env.HAS_P12 == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          P12: ${{ secrets.MAC_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -P "$P12_PASSWORD" -A -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/sign.p12"
          # Without this, codesign stops with errSecInternalComponent.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials ninaivu --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" --keychain "$keychain"
          echo "NINAIVU_MAC_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "NINAIVU_NOTARY_PROFILE=ninaivu" >> "$GITHUB_ENV"
          echo "NINAIVU_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: bash installers/macos/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: |
            installers/macos/build/*.dmg
            installers/macos/build/*-packages.txt
            installers/macos/build/homebrew/ninaivu.rb

  linux:
    name: Linux and Raspberry Pi (${{ matrix.arch }})
    needs: gate
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python -m pip install -c requirements/build-tools.txt pip
          bash installers/linux/build.sh "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            installers/linux/build/*.sh
            installers/linux/build/*-packages.txt

  release:
    name: Attach to the release
    needs: [gate, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      # For the provenance attestation of the files attached below.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
      HAS_PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.MAC_SIGN_P12_BASE64 != '' && secrets.MAC_NOTARY_PASSWORD != '' }}
    steps:
      # The guide's pages, its builder and the changelog go out with the installers.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
      - name: The version being released
        run: |
          # Read from ninaivu/__init__.py by the gate, which checked a tag against it.
          [ -n "$VERSION" ] || { echo "no version"; exit 1; }
          echo "releasing $VERSION"
      - name: One cask with both hashes
        run: |
          arm=$(sha256sum out/macos-arm64/*.dmg | cut -d' ' -f1)
          intel=$(sha256sum out/macos-x86_64/*.dmg | cut -d' ' -f1)
          sed -e "s/__SHA256_ARM64__/$arm/" -e "s/__SHA256_X86_64__/$intel/" out/macos-arm64/homebrew/ninaivu.rb > out/ninaivu.rb
          mkdir -p out/winget && cp -r out/windows/winget/* out/winget/ 2>/dev/null || true
          ls -R out
      # The guides are built here from the pages at this tag, so the PDFs that
      # go out always say what the pages say — the copies committed under
      # docs/ are for reading on GitHub and can lag a change to a page.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The guide, in English and Tamil
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-core
          for f in "Noto Sans Tamil" "Noto Serif Tamil" "Noto Serif"; do
            fc-list | grep -qi "$f" || { echo "no $f: the guides would print boxes or a stand-in face"; exit 1; }
          done
          pip install -q -c src/requirements/build-tools.txt markdown playwright pypdf
          python -m playwright install --with-deps chromium
          python src/tools/build_guide_pdf.py out/Ninaivu-guide.pdf
          python src/tools/build_guide_pdf.py --lang ta out/Ninaivu-guide-ta.pdf
          python src/tools/build_guide_pdf.py --lang admin out/Ninaivu-admin-guide.pdf
      - name: Checksums
        run: |
          # By file name alone, as they are on the release page, so that
          # `sha256sum -c --ignore-missing SHA256SUMS.txt` works in the folder
          # they were downloaded to.
          cd out
          for file in windows/nsis/*.exe windows/portable/*.zip macos-arm64/*.dmg macos-x86_64/*.dmg linux-amd64/*.sh linux-arm64/*.sh \
                      windows/nsis/*-packages.txt macos-arm64/*-packages.txt macos-x86_64/*-packages.txt \
                      linux-amd64/*-packages.txt linux-arm64/*-packages.txt; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")")
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # A signed statement that these files were built by this workflow from
      # this commit, kept with the repository: `gh attestation verify <file>
      # --repo javajaga-usa/Ninaivu` checks a download against it, which a
      # checksum on the same page as the file cannot.
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/windows/nsis/*.exe
            out/windows/portable/*.zip
            out/macos-arm64/*.dmg
            out/macos-x86_64/*.dmg
            out/linux-amd64/*.sh
            out/linux-arm64/*.sh
            out/SHA256SUMS.txt
      # The notes say what is in this release (its section of the changelog)
      # and, honestly, whether the installers are signed: an unsigned one
      # meets SmartScreen on Windows and Gatekeeper on a Mac, and the person
      # opening it should know that before they see the warning.
      - name: Release notes
        run: |
          version=$VERSION
          {
            echo "Ninaivu $version — your family's photographs, on a computer at home."
            echo
            echo "**Windows:** \`Ninaivu-$version-windows-x64.exe\`, or \`Ninaivu-$version-windows-x64-portable.zip\` to run without installing (extract it anywhere, even a USB drive, and open \`Ninaivu.exe\`; the zip holds \`Ninaivu.exe\`, \`app\` and \`logs\` and nothing else). **macOS:** the \`.dmg\` for Apple silicon (\`arm64\`) or Intel (\`x86_64\`). **Linux and Raspberry Pi:** \`Ninaivu-$version-linux-amd64.sh\` for a PC, \`Ninaivu-$version-linux-arm64.sh\` for a Raspberry Pi 4 or 5 with a 64-bit OS — run it with \`sh\`, no root needed. Docker and running from source are in the technical administrator guide."
            echo "Every installer carries its own Python, so the computer needs none, and every package: nothing is downloaded at install time. The checksums are in \`SHA256SUMS.txt\` (how to check one: the Security page of the docs); each \`*-packages.txt\` lists what that installer carries. \`ninaivu.rb\` is the Homebrew cask and the winget manifests are in the build artifacts, for publishing to those catalogues."
            echo
            echo "**The guide**, to read or share: \`Ninaivu-guide.pdf\` (English) and \`Ninaivu-guide-ta.pdf\` (தமிழ்). For whoever looks after the technical side: \`Ninaivu-admin-guide.pdf\` (English)."
            echo
            if [ "$HAS_PFX" != "true" ]; then
              echo "> **The Windows installer is not signed.** SmartScreen will say *Windows protected your PC*: choose **More info → Run anyway**."
              echo
            fi
            if [ "$HAS_NOTARY" != "true" ]; then
              echo "> **The Mac app is not signed or notarised.** macOS will refuse to open it at first: open it once, then go to **System Settings → Privacy & Security** and choose **Open Anyway**."
              echo
            fi
            echo "## What is in $version"
            awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' src/docs/CHANGELOG.md
          } > notes.md
          cat notes.md

      # Made as a draft with every file attached, then published in one step:
      # with immutable releases turned on, nothing can be added to a release
      # once it is out, and a release is never out with half its files.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Ninaivu v${{ env.VERSION }}
          body_path: notes.md
          draft: true
          fail_on_unmatched_files: true
          files: |
            out/windows/nsis/*.exe
            out/windows/portable/*.zip
            out/macos-arm64/*.dmg
            out/macos-x86_64/*.dmg
            out/linux-amd64/*.sh
            out/linux-arm64/*.sh
            out/windows/nsis/*-packages.txt
            out/macos-arm64/*-packages.txt
            out/macos-x86_64/*-packages.txt
            out/linux-amd64/*-packages.txt
            out/linux-arm64/*-packages.txt
            out/ninaivu.rb
            out/SHA256SUMS.txt
            out/Ninaivu-guide.pdf
            out/Ninaivu-guide-ta.pdf
            out/Ninaivu-admin-guide.pdf

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false --repo "$GITHUB_REPOSITORY"

      - name: Open the winget pull request
        if: env.HAS_WINGET_TOKEN == 'true'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          version=$VERSION
          # wingetcreate is a Windows tool; the manifests are complete, so the
          # cross-platform route is the winget-pkgs fork and a PR from it.
          echo "Manifests for $version are in out/winget; submit them to microsoft/winget-pkgs under manifests/n/Ninaivu/Ninaivu/$version/."

  # The container image for this version, pushed to the GitHub container
  # registry with the version's tags. From here rather than on the tag push in
  # docker.yml: a release made with "Run workflow" pushes no tag event, and the
  # image stopped at 0.1.2 while the installers went on to 1.0.1.
  docker:
    name: Docker image
    needs: [gate, release]
    permissions:
      contents: read
      packages: write
      # A called workflow can hold no more than its caller grants: these two
      # are for the image's provenance attestation in docker.yml.
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.gate.outputs.version }}
