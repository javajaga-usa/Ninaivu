name: On-device AI engine · real models

# The image models of the on-device AI engine (ninaivu/runtime/siglip.py,
# florence.py) checked with the real downloads, which the test suite cannot
# afford: about 7 GB from Hugging Face. Runs when a pull request changes how
# those models are run or pinned, and on request. Not part of the release
# gate (tests.yml): it says whether search without PyTorch gives PyTorch's
# vectors, whether the descriptions read as English, and how long each takes
# on a Linux machine and on Apple silicon, which is what the household's Mac
# mini is.
on:
  pull_request:
    branches: [main]
    paths:
      - "ninaivu/runtime/siglip.py"
      - "ninaivu/runtime/florence.py"
      # What runs them: the host process, the describer and the device choice.
      - "ninaivu/runtime/host.py"
      - "ninaivu/runtime/describer.py"
      - "ninaivu/runtime/devices.py"
      - "ninaivu/media/model_catalog.py"
      - "tools/check_onnx_search.py"
      - "tools/try_captions.py"
      - ".github/workflows/ai-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  models:
    name: Real models · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple silicon: ONNX Runtime's Core ML provider is there.
        os: [ubuntu-latest, macos-14]
    env:
      NINAIVU_AI_MODELS_DIR: ${{ github.workspace }}/.ai-models
      NINAIVU_STATE_DIR: ${{ github.workspace }}/.state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      # The engine's packages, and PyTorch's stack to compare against. On
      # Linux the processor-only PyTorch, a fraction of the default's size.
      - name: Install the engine and PyTorch's stack
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements/requirements.txt -r requirements/requirements-image-engine.txt
          if [ "$RUNNER_OS" = "Linux" ]; then
            # torchvision from the same index, or PyPI's (built for another
            # torch) fails to load its operators ("torchvision::nms").
            pip install "torch>=2.14.1,<3" torchvision --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -r requirements/requirements-ai.txt scikit-image
          pip install -e .
          python -c "import onnxruntime as o; print('ONNX Runtime', o.__version__, o.get_available_providers())"
      - name: Download the models, checked against their pins
        run: python tools/fetch_ai_models.py --get search-onnx captions captions-large siglip2
      # Real photographs that come with scikit-image: an astronaut, a cat, a
      # cup of coffee, a rocket, a coin collection, a camera man.
      - name: Photographs to try
        run: |
          mkdir -p photos
          python - <<'EOF'
          from PIL import Image
          from skimage import data
          for name in ("astronaut", "chelsea", "coffee", "rocket", "coins", "camera"):
              try:
                  Image.fromarray(getattr(data, name)()).convert("RGB").save(f"photos/{name}.jpg", quality=92)
              except Exception as exc:
                  print(name, "not available:", exc)
          EOF
          ls -l photos
      - name: Search without PyTorch gives PyTorch's vectors
        run: python tools/check_onnx_search.py photos
      - name: Describe the photographs (Florence-2 base)
        if: success() || failure()
        run: python tools/try_captions.py photos --model captions
      - name: Describe the photographs (Florence-2 large)
        if: success() || failure()
        run: python tools/try_captions.py photos --model captions-large
      # Core ML's two ways, to compare with the processor's descriptions and
      # times above; not yet the default (runtime/devices.py IMAGE_DEVICES).
      - name: Describe the photographs on Core ML (Florence-2 base)
        if: (success() || failure()) && runner.os == 'macOS'
        continue-on-error: true
        run: |
          python tools/try_captions.py photos --model captions --device coreml
          python tools/try_captions.py photos --model captions --device coreml-gpu
