name: Docs site

# The documentation site (mkdocs.yml), published to GitHub Pages on every
# push to main. Pull requests only build it, so a broken link fails there.
#
# GitHub Free gives no Pages to a private repository, so while this one is
# private the site goes to the gh-pages branch of the public releases
# repository (RELEASES_REPO, written with RELEASES_TOKEN, the same pair the
# release workflow uses), whose Pages serve that branch:
# https://javajaga-usa.github.io/Ninaivu-releases/ (site_url in mkdocs.yml).

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml", "ninaivu/static/icons/**"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

# Read-only by default; only the job that publishes may write to Pages.
permissions:
  contents: read

# PR builds must not cancel production deployments. Let a running production
# deployment finish; newer PR builds may replace older builds of the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material==9.7.7"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ !github.event.repository.private }}
        with:
          path: site-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.event.repository.private
        with:
          name: site
          path: site-build

  deploy:
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # While the source is private: the same site, as the whole of the public
  # releases repository's gh-pages branch, replaced each time.
  deploy-public:
    if: github.event_name != 'pull_request' && github.event.repository.private
    needs: build
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      RELEASES_REPO: ${{ vars.RELEASES_REPO || 'javajaga-usa/Ninaivu-releases' }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site-build
      - name: Push the site to the releases repository's gh-pages
        run: |
          set -euo pipefail
          [ -n "$RELEASES_TOKEN" ] || { echo "::error::no RELEASES_TOKEN secret: the site has nowhere public to go"; exit 1; }
          cd site-build
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "The docs site, from $GITHUB_REPOSITORY at ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${RELEASES_TOKEN}@github.com/${RELEASES_REPO}.git" gh-pages
          echo "published to https://github.com/${RELEASES_REPO}/tree/gh-pages"
