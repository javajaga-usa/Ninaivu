name: Tests & Linting

on:
  push:
    branches: [main, develop, "release-*", "codex/release-*"]
  pull_request:
    branches: [main, develop, "release-*"]

# Nothing in the four jobs below is allowed to fail quietly. A check that
# reports and then passes anyway is worse than no check: it costs the same
# minutes, prints the same red text, and teaches everyone reading the summary
# that red text means nothing. The one exception is the audit job at the
# bottom, which on a pull request blocks only one that changes the
# dependencies (a push to main always blocks); the reason is written there.
#
# Every job has a time limit, a few times what it takes on a good day, and
# every test has one too (pytest-timeout, pyproject.toml): a test that hangs
# fails in minutes, by name, instead of holding a runner for six hours.

# Nothing here writes to the repository.
permissions:
  contents: read

# A new push to a pull request cancels its run still going: those minutes held
# the runners the release gate was waiting on (10 Oct 2026, 1.10.5). A push
# is grouped by its own commit, so it is never cancelled or dropped from the
# queue — the release gate needs a passed push run on the very commit it
# releases, and a tag may be on a commit main has since moved past.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Windows runners take 30 to 45 minutes for the whole suite, and a run that
    # reached its last tests was cancelled at 45, which the release gate reads
    # as a failure. The limit is for a hang, not for a slow machine. On
    # 23 Oct 2026 Windows with Python 3.12 took 73 minutes for the core suite
    # and was cancelled at 75 in the extension tests that come after it.
    timeout-minutes: 100
    strategy:
      # Every combination runs even after one fails: "it broke on Windows"
      # and "it broke everywhere" are different problems, and cancelling the
      # rest hides which one this is.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Both ends of what pyproject.toml promises: the oldest interpreter
        # Ninaivu claims to run on, and the one it is developed against. The
        # versions in between do not break on their own — a change that fails
        # on 3.12 fails at one end of this range too — and paying for five
        # interpreters on three operating systems to learn that is how a suite
        # stops being run at all.
        python-version: ["3.12", "3.14"]
        # No macOS run: it was the slowest job (close to an hour) and said
        # little the Linux runs do not. The Mac build is still made and
        # opened on every pull request that touches it (release.yml), and
        # the model stack still runs on Apple silicon (full-tier below).

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # On 3.12, with the exact versions the installers ship
      # (requirements/constraints-tested.txt): the release workflow publishes
      # only a commit these jobs passed on, so what ships is what was tested.
      # 3.14 resolves the ranges, as a fresh `pip install` would.
      - name: Install dependencies
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          constraints=()
          if [ "$PYTHON_VERSION" = "3.12" ]; then constraints=(-c requirements/constraints-tested.txt); fi
          pip install -r requirements/requirements-dev.txt "${constraints[@]}"

      # The whole suite, and it has to pass. The runners ship Node, so the
      # browserless UI checks under tests/*.mjs run here too — the pytest
      # wrappers that drive them skip only where Node is missing. No extension
      # is installed for this run: the core has to pass on its own, which is
      # what a fresh install is.
      - name: Run the test suite (core only)
        run: pytest -q

      # Then with every extension in the repository installed, so their tests
      # run too instead of skipping themselves. Every file that skips without
      # an extension has to be named here; test_tightening_tests.py checks the list.
      - name: Install the extensions
        run: pip install -e . -e extensions/gemini -e extensions/creative-studio

      - name: Run the extension tests
        run: pytest -q tests/test_gemini_key.py tests/test_gemini_media.py tests/test_extensions.py tests/test_ai_server.py tests/test_generative_editing.py tests/test_data_security_gemini.py tests/test_data_security_cloud.py tests/test_audit_2026_09_29_security.py tests/test_audit_2026_10_06_gemini.py tests/test_audit_2026_10_06_studio.py tests/test_review_fixes_control.py tests/test_audit_2026_10_10_egress.py tests/test_audit_2026_10_10_gemini_key.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      # Ruff at the version in requirements-dev.txt, which is the one the
      # pre-commit hook and every developer run: an inline pin here drifted to
      # an older release, so the gate and the desk could disagree.
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints-tested.txt ruff "build>=1,<2"

      # Ruff reads its rules from pyproject.toml: pyflakes and pycodestyle,
      # which catch mistakes. Black and isort are deliberately not run here.
      # Ninaivu is formatted by hand — line breaks fall where the meaning does,
      # and imports are grouped so the lazy ones stay next to what they are
      # deferring. Enforcing either tool would rewrite thousands of lines
      # without fixing a single defect, so the gate would be measuring
      # obedience rather than quality.
      - name: Lint with Ruff
        run: ruff check ninaivu tests tools launcher extensions

      - name: Build and verify distribution
        run: |
          python -m build --wheel
          python tools/check_distribution.py

      # The pinned set must install together, as constraints-tested.txt's own
      # instructions, the Docker image with WITH_AI=1 and the launcher's AI
      # search install use it, with both extensions beside the core. Resolved
      # only, nothing is built or kept: sympy's mpmath (audit D-15) and the
      # extensions' Pillow cap each broke an install no test job did.
      - name: The pinned packages install together
        timeout-minutes: 12
        run: |
          pip install --dry-run --ignore-installed --quiet \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -c requirements/constraints-tested.txt \
            -r requirements/requirements.txt \
            -r requirements/requirements-desktop.txt \
            -r requirements/requirements-ai.txt \
            . ./extensions/gemini ./extensions/creative-studio

  # The two kinds of computer Ninaivu is tested on (docs/ROADMAP.md, server/tiers.py).
  basic-tier:
    name: Basic tier · 2 GB, no GPU
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      # At the versions the portable builds ship, as the 3.12 test jobs above:
      # the small machine this stands in for runs exactly those.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements/requirements-dev.txt -c requirements/constraints-tested.txt
      # The whole suite inside a 2 GB memory cgroup, as the Basic machine
      # would run it: a test that only passes with more memory fails here,
      # and swap is off so it fails rather than crawls. The tier is set
      # outright, so "auto" resolves to the light engine as it would on
      # that box.
      - name: Run the suite as a Basic machine
        env:
          NINAIVU_HARDWARE_TIER: basic
        run: |
          sudo systemd-run --wait --pipe --collect --same-dir \
            --uid="$(id -u)" --gid="$(id -g)" \
            -p MemoryMax=2G -p MemorySwapMax=0 \
            --setenv=NINAIVU_HARDWARE_TIER=basic --setenv=PATH="$PATH" \
            --setenv=HOME="$HOME" --setenv=LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \
            "$(which python)" -m pytest -q -m "not tier_full"

  full-tier:
    name: Full tier · Apple silicon, model stack
    # macos-14 runners are Apple silicon (M1): the image model runs on MPS.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The macOS 15 runners cannot resolve their own host name: every
      # getaddrinfo(gethostname()) (the HTTPS certificate's names, the
      # addresses the console lists) waits out an mDNS timeout. On 5 Oct that
      # made test_https.py alone take 22 minutes and the job hit its limit.
      - name: Let the runner resolve its own name
        if: runner.os == 'macOS'
        run: |
          name=$(hostname)
          echo "127.0.0.1 ${name} ${name%%.*} ${name%%.*}.local" | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache || true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies and the model stack
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements/requirements-dev.txt -r requirements/requirements-ai.txt
          pip install -e . -e extensions/creative-studio
      - name: The tier is measured, not set
        run: python -c "from ninaivu.server import tiers, config; t = tiers.current(config.Config()); print(t); assert t['tier'] == 'full', t"
      - name: Run the Full-tier tests, and the suite on top
        env:
          NINAIVU_HARDWARE_TIER: full
        run: |
          pytest -q -m tier_full
          pytest -q -m "not tier_full"     # the rest; the Full-tier ones just ran

  browser:
    name: Browser tests (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every suite on Chromium; the critical flows on WebKit too, Safari's
    # engine, since the family app is mostly used on iPhones
    # (run_browser_tests.WEBKIT_FLOWS; external audit 2026-10-11, QA-01).
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Playwright at the version build-tools.txt gives the guide builds, so a
      # new release cannot change what these tests see without a commit.
      # ffmpeg makes the Live Photo clips in the pairs fixture real videos;
      # without it they are empty files the viewer cannot play.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements/requirements-dev.txt -c requirements/constraints-tested.txt
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps ${{ matrix.engine }}

      - name: Run browser tests
        run: python tests/run_browser_tests.py --engine ${{ matrix.engine }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # On a pull request it blocks only when the change touches what Ninaivu
    # depends on. An advisory somebody published this morning about a library
    # Ninaivu already depended on yesterday is not a defect in the pull request
    # that happened to trigger it, and blocking an unrelated change on it
    # teaches people to merge past red. A change that adds or moves a
    # requirement is making a claim about exactly that, and is held to it.
    #
    # A push to main always blocks, dependencies changed or not: the release
    # workflow ships only a commit whose push run is green, and an advisory
    # nobody has decided about must not ship because no requirement file moved
    # (external audit 2026-10-11, SEC-02). The decision is written down in
    # requirements/audit-exceptions.toml, with an owner, a reason and an expiry
    # date, by tools/audit_gate.py's rules; an expired one blocks again.
    # Either way every finding, accepted or not, is on the run's summary page.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Does this commit change the dependencies?
        id: deps
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=false
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=true             # a new branch, or history we cannot see
          elif git diff --name-only "$BASE" HEAD -- requirements pyproject.toml \
                 'extensions/*/pyproject.toml' | grep -q .; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "dependencies changed in this commit: $changed"

      # Everything an installed Ninaivu can be running: the core, the tray, the
      # model stack, local editing, background removal and the text reader
      # (the extensions add nothing outside these). Installed together, as a
      # household would, with the CPU build of torch so the job does not
      # download the graphics-card one. What is audited is what pip actually
      # chose, pinned: the advisories are about versions, not ranges.
      - name: Install every requirement set
        run: |
          python -m venv "$RUNNER_TEMP/everything"
          . "$RUNNER_TEMP/everything/bin/activate"
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements/requirements.txt \
            -r requirements/requirements-desktop.txt \
            -r requirements/requirements-ai.txt \
            -r requirements/requirements-ai-editing.txt \
            -r requirements/requirements-ai-local.txt \
            -r requirements/requirements-ai-segmentation.txt \
            -r requirements/requirements-ocr.txt \
            -r requirements/requirements-speech.txt
          # "+cpu" is the PyTorch index's build tag; the advisories know the
          # version without it.
          pip freeze --exclude-editable | sed -E 's/\+[A-Za-z0-9.]+$//' > "$RUNNER_TEMP/installed.txt"
          # The writing model's runner (llama.cpp, built from source when
          # installed) and the image engine are not installed here; what pip
          # would choose for them is resolved without building and audited
          # with the rest (audit C-23). A package already above keeps the
          # version that is installed.
          pip install --dry-run --ignore-installed --quiet --report "$RUNNER_TEMP/optional.json" \
            -c requirements/constraints-tested.txt \
            -r requirements/requirements-text-model.txt \
            -r requirements/requirements-image-engine.txt
          python - "$RUNNER_TEMP/optional.json" "$RUNNER_TEMP/installed.txt" <<'PY'
          import json, re, sys
          key = lambda name: re.sub(r"[-_.]+", "-", name).lower()
          installed = open(sys.argv[2]).read().splitlines()
          have = {key(line.split("==")[0]) for line in installed if "==" in line}
          extra = [f"{i['metadata']['name']}=={i['metadata']['version']}"
                   for i in json.load(open(sys.argv[1]))["install"]
                   if key(i["metadata"]["name"]) not in have]
          open(sys.argv[2], "a").write("".join(f"{line}\n" for line in extra))
          print("optional parts added to the audit:", ", ".join(extra) or "none")
          PY
          wc -l "$RUNNER_TEMP/installed.txt"

      # pip-audit reads the advisories PyPI itself publishes and needs no
      # account to do it. `safety check` used to stand here; it now exits
      # non-zero on its own deprecation notice whatever the dependencies say,
      # which made this step a coin toss rather than a check.
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.10.1"   # pinned, like the tools in requirements/build-tools.txt

      # pip-audit exits non-zero when it finds anything; whether that stops
      # the build is the gate's decision, below, so its own status is not.
      - name: Audit dependencies
        run: |
          set +e
          pip-audit -r "$RUNNER_TEMP/installed.txt" --no-deps --disable-pip \
            --progress-spinner off --desc on -f json -o "$RUNNER_TEMP/audit.json"
          status=$?
          if [ ! -s "$RUNNER_TEMP/audit.json" ]; then
            echo "pip-audit wrote no report (exit $status)"
            exit 1
          fi

      - name: Decide, and write what was found on the summary page
        env:
          BLOCKING: ${{ github.event_name != 'pull_request' || steps.deps.outputs.changed == 'true' }}
        run: |
          set -o pipefail
          flag=""
          if [ "$BLOCKING" = "true" ]; then flag="--blocking"; fi
          {
            if [ "$BLOCKING" = "true" ]; then
              echo "_This build blocks on an advisory that is not accepted._"
            else
              echo "_This pull request does not change the dependencies: advisories are reported, not blocking._"
            fi
            echo
            python tools/audit_gate.py "$RUNNER_TEMP/audit.json" \
              requirements/audit-exceptions.toml $flag
          } | tee -a "$GITHUB_STEP_SUMMARY"
