name: Docker Build & Push

# Every push to main and every pull request builds the image, so a broken
# Dockerfile shows up there. Nothing is pushed from those: the image is
# published by the release workflow (release.yml calls this one with the
# version), tagged with that version, its major.minor and latest, and
# labelled with it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: The version being released, without the v
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (not pushed)
    if: inputs.version == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: installers/docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Build and push ${{ inputs.version }}
    if: inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the provenance attestation below: the OIDC token signs it, and
      # the attestation is stored against the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GitHub's own registry: the repository's token is enough, and the image
      # has a namespace (a bare "ninaivu" on Docker Hub is docker.io/library,
      # which nobody can push to).
      - name: Log in to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/ninaivu
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build and push the image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: installers/docker/Dockerfile
          push: true
          build-args: |
            NINAIVU_VERSION=${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A signed statement, kept by GitHub, that this digest was built by this
      # workflow from this commit — the same provenance the release's
      # installers carry. `gh attestation verify oci://ghcr.io/<owner>/ninaivu:<tag>
      # --owner <owner>` checks it.
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ninaivu
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
