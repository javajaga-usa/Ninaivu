name: Docker Build & Push

# Every push to main and every pull request builds the image, so a broken
# Dockerfile shows up there. Nothing is pushed from those: the image is
# published by the release workflow (release.yml calls this one with the
# version), tagged with that version, its major.minor and latest, and
# labelled with it.
#
# Built for x64 (amd64) and arm64 (a Raspberry Pi 4 or 5, an arm64 server),
# each on a runner of its own kind rather than under emulation, and started:
# each has to answer its health check before the job passes. The release
# publishes one image for both; its arm64 half is built under emulation
# there, which is slower but makes one digest to attest.

# Built and started on a push or pull request only when what goes into the
# image changes: a private repository's minutes on GitHub Free cover a few
# hours of building it on every change (tests.yml says more). Every release
# builds and pushes it whatever changed.
on:
  push:
    branches: [main]
    paths:
      - "installers/docker/**"
      - "requirements/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "installers/docker/**"
      - "requirements/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  workflow_call:
    inputs:
      version:
        description: The version being released, without the v
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and start (amd64, not pushed)
    if: inputs.version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: installers/docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ninaivu:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      # The image starts and answers its own health
      # check (curl /healthz inside the container), with the native libraries
      # the media code loads actually loadable.
      - name: Start it and wait for it to be healthy
        run: |
          docker run -d --name ninaivu-ci ninaivu:ci
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' ninaivu-ci 2>/dev/null || echo gone)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "gone" ] || [ "$(docker inspect --format '{{.State.Running}}' ninaivu-ci)" != "true" ]; then
              docker logs ninaivu-ci; exit 1
            fi
            sleep 5
          done
          [ "$status" = "healthy" ] || { docker logs ninaivu-ci; exit 1; }
          docker exec ninaivu-ci python -c "import platform, PIL.Image, numpy, cv2, sqlite3; print(platform.machine(), 'media libraries load')"
          docker exec ninaivu-ci ffmpeg -hide_banner -version | head -1
          test "$(docker exec ninaivu-ci uname -m)" = x86_64

      - name: Server log
        if: always()
        run: docker logs ninaivu-ci 2>&1 | tail -50 || true

  build-arm64:
    name: Build and start (arm64, not pushed)
    if: inputs.version == ''
    # GitHub's arm64 runners are free for public repositories only; a runner
    # in Docker on the Mac mini is arm64 too (and builds with the Mac's Docker).
    runs-on: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: installers/docker/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ninaivu:ci
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Start it and wait for it to be healthy
        run: |
          docker run -d --name ninaivu-ci ninaivu:ci
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' ninaivu-ci 2>/dev/null || echo gone)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "gone" ] || [ "$(docker inspect --format '{{.State.Running}}' ninaivu-ci)" != "true" ]; then
              docker logs ninaivu-ci; exit 1
            fi
            sleep 5
          done
          [ "$status" = "healthy" ] || { docker logs ninaivu-ci; exit 1; }
          docker exec ninaivu-ci python -c "import platform, PIL.Image, numpy, cv2, sqlite3; print(platform.machine(), 'media libraries load')"
          docker exec ninaivu-ci ffmpeg -hide_banner -version | head -1
          test "$(docker exec ninaivu-ci uname -m)" = aarch64

      - name: Server log
        if: always()
        run: docker logs ninaivu-ci 2>&1 | tail -50 || true

  publish:
    name: Build and push ${{ inputs.version }}
    if: inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the provenance attestation below: the OIDC token signs it, and
      # the attestation is stored against the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # For the arm64 half of the image, built on this x64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GitHub's own registry: the repository's token is enough, and the image
      # has a namespace (a bare "ninaivu" on Docker Hub is docker.io/library,
      # which nobody can push to).
      - name: Log in to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/ninaivu
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build and push the image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: installers/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NINAIVU_VERSION=${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=release

      # A signed statement, kept by GitHub, that this digest was built by this
      # workflow from this commit — the same provenance the release's
      # installers carry. `gh attestation verify oci://ghcr.io/<owner>/ninaivu:<tag>
      # --owner <owner>` checks it. None while the source repository is
      # private: GitHub makes them only for public ones on the Free plan.
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ninaivu
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
