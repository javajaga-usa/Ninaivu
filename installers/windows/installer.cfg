# The Windows installer, built with pynsist (https://pynsist.readthedocs.io).
#
#   installers\windows\build.ps1            from the repository root
#
# What it makes: Ninaivu-<version>-windows-x64.exe, an NSIS installer that
# puts a private Python, Ninaivu and every wheel it needs under
# %LOCALAPPDATA%\Programs\Ninaivu (no administrator rights), adds a Start
# menu entry that opens the tray, and starts the tray at sign-in when the
# person leaves that box ticked. Nothing is downloaded at install time.
#
# The version line is rewritten by build.ps1 from ninaivu/__init__.py, and
# the wheels under wheels\ are built there too (pip wheel), so this file
# never pins them by hand.

[Application]
name=Ninaivu
version=0.0.0
# The tray, not the server: the tray starts the server and is what a person
# sees. pythonw, so no console window.
entry_point=ninaivu.desktop.tray:main
console=false
icon=ninaivu.ico
license_file=..\..\LICENSE
publisher=Ninaivu contributors

[Python]
version=3.12.10
bitness=64
# The embeddable build is enough: the server and the tray are pure Python
# on top of wheels, and nothing here compiles anything.
include_msvcrt=true

[Include]
# The package itself, from the checkout two levels up.
packages=ninaivu
# Everything requirements/requirements.txt and requirements-desktop.txt
# resolve to, built as wheels by build.ps1 into this folder.
local_wheels=wheels\*.whl
# The extensions ship in the installer, off until switched on.
files=..\..\extensions\gemini\ninaivu_gemini > $INSTDIR\pkgs
      ..\..\extensions\creative-studio\ninaivu_studio > $INSTDIR\pkgs
      ..\..\README.md
      ..\..\LICENSE

[Command ninaivu]
# `ninaivu` on the command line, for the people who want it.
entry_point=ninaivu.__main__:main

[Build]
installer_name=Ninaivu-{version}-windows-x64.exe
nsi_template=ninaivu.nsi
