services:
  ninaivu:
    # Built from this checkout. To run the image published with each release
    # instead, put `image: ghcr.io/javajaga-usa/ninaivu:<version>` (or
    # `:latest`) here and delete the build: block.
    image: ninaivu:local
    build:
      context: ../..
      dockerfile: installers/docker/Dockerfile
      # args: { WITH_AI: "1" }   # add search by description (about 2 GB)
    container_name: ninaivu
    restart: unless-stopped
    # Docker's default 10 s cuts the orderly stop short (up to 20 s, then
    # the web connections still sending finish).
    stop_grace_period: 45s
    env_file:
      - .env
    # Only where things are. Everything about how Ninaivu behaves is chosen
    # in the console; a value here would only fill in what nobody chose there.
    environment:
      - NINAIVU_STATE_DIR=/data/state
      - NINAIVU_PORT=5000
      - NINAIVU_ADMIN_PORT=3000
    ports:
      # Family App — expose to local network
      - "5000:5000"
      # Admin Console — bind to localhost or keep protected
      - "127.0.0.1:3000:3000"
    volumes:
      # Mount your host media directory here (read-only for security, or read-write for trash bin support)
      - ${MEDIA_DIR:-./photos}:/data/media
      # Persistent state directory: SQLite indexes, thumbnails, session keys, cloud tokens
      - ninaivu_state:/data/state
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:$${NINAIVU_PORT:-5000}/healthz\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional Caddy reverse proxy for automatic HTTPS with a real domain or local trust
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: ninaivu-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - ninaivu

volumes:
  ninaivu_state:
    name: ninaivu_state
