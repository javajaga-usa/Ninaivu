# =============================================================================
# Ninaivu 5.0.0 — Production Nginx Configuration
# High-performance reverse proxy with SSL hardening, caching & SSE support
# =============================================================================

upstream ninaivu_family {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream ninaivu_admin {
    server 127.0.0.1:3000;
    keepalive 16;
}

# --- HTTP to HTTPS Redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name photos.example.com admin.photos.example.com;
    return 301 https://$host$request_uri;
}

# --- Family App Server Block ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name photos.example.com;

    # SSL Certificates (Let's Encrypt / Certbot / custom)
    ssl_certificate /etc/letsencrypt/live/photos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photos.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Max body size for uploads (e.g. avatars)
    client_max_body_size 32M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/manifest+json image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Immutable Cache for Thumbnails & Derivatives
    location ~* ^/api/thumb/ {
        proxy_pass http://ninaivu_family;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache headers for browser
        # Preserve the application's access-dependent Cache-Control policy.
    }

    # Static Assets Cache
    location /static/ {
        proxy_pass http://ninaivu_family;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Only the app knows whether a URL has a current content fingerprint.
    }

    # Real-time Event Streams (SSE - Server Sent Events)
    location ~* ^/api/(scan|archive)/stream {
        proxy_pass http://ninaivu_family;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Default Media & API Proxy
    location / {
        proxy_pass http://ninaivu_family;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Admin Console Server Block (Restricted Subnet) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.photos.example.com;

    ssl_certificate /etc/letsencrypt/live/photos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photos.example.com/privkey.pem;

    # Restrict console access strictly to trusted local subnets
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny all;

    client_max_body_size 64M;

    location ~* ^/api/(scan|archive)/stream {
        proxy_pass http://ninaivu_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://ninaivu_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
